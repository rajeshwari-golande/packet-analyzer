[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-analyzer"
version = "2.0.0"
description = "Offline deep packet inspection for PCAP files with SNI-based classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajeshwari Golande", email = "rajeshwari.golande22@pccoepune.org" }]
keywords = ["dpi", "pcap", "network", "tls", "sni"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.scripts]
packet-analyzer = "packet_analyzer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packet_analyzer*"]